syntax = "proto3";
 
package supporthub.agentdesk.v1;
 
option csharp_namespace = "SupportHub.AgentDesk.V1";
 
import "google/protobuf/timestamp.proto"; // -> DateTime / DateTimeOffset (UTC)
import "google/protobuf/duration.proto";    // -> TimeSpan


// Naming: the service is "AgentDeskService", not "AgentDesk".
service AgentDeskService {
  
  //Unary
  rpc GetTicket (GetTicketRequest) returns (Ticket);

  rpc AssignTicket (AssignTicketRequest) returns (AssignTicketResponse);

  //Server streaming
  rpc WatchQueue (WatchQueueRequest) returns (stream QueueEvent);

  //Client streaming
  rpc ImportTickets (stream ImportTicketRequest) returns (ImportTicketsResponse);

  //BIDIRECTIONAL STREAMING: two independent streams -------------
  // Live chat on a ticket. Who you are travels in METADATA (headers), not in the message: x-ticket-id, x-display-name, x-role (agent | customer).
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
}


//ENUMS
enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_STATUS_OPEN = 1;
  TICKET_STATUS_IN_PROGRESS = 2;
  TICKET_STATUS_RESOLVED = 3;
  TICKET_STATUS_CLOSED = 4;
}

enum TicketPriority {
  TICKET_PRIORITY_UNSPECIFIED = 0;
  TICKET_PRIORITY_LOW = 1;
  TICKET_PRIORITY_MEDIUM = 2;
  TICKET_PRIORITY_HIGH = 3;
  TICKET_PRIORITY_CRITICAL = 4;
}


//MESSAGES
message Ticket {
int32 ticket_id = 1;
string title = 2;
string description = 3;
TicketStatus status = 4;
TicketPriority priority = 5;
int32 customer_id = 6;
optional int32 assigned_agent_id = 7;
google.protobuf.Timestamp created_at_utc = 8;
google.protobuf.Timestamp updated_at_utc = 9;
 
repeated string tags = 10;
 
}

message Agent {
int32 agent_id = 1;
string display_name = 2;
string email = 3;
bool is_active = 4;
int32 open_ticket_count = 5;
 
}
 
message GetTicketRequest {
int32 ticket_id = 1;
}

message AssignTicketRequest {
  int32 ticket_id = 1;
}

message AssignTicketResponse {
  Ticket ticket = 1;
  Agent agent = 2;
}

//Server Streaming
message WatchQueueRequest {
  // Deliberately empty for now. Filters (by agent, by minimum priority) are an
  // ADDITIVE change later: add fields 1, 2, 3 and every existing client is fine.
}

message QueueEvent {
  google.protobuf.Timestamp occurred_at = 1;
 
  // `oneof`: exactly one of these is set. C# gives you QueueEvent.PayloadOneofCase
  // to switch on, and only the chosen field goes over the wire.
  oneof payload {
    Ticket backlog = 2; // an already-open ticket, replayed at the start
    TicketAssigned assigned = 3; //a ticket was routed to an agent
    Ticket created = 4;            // added in Client streamind: a brand-new ticket arrived (Nothing broke by adding a field)
  }
}
 
message TicketAssigned {
  Ticket ticket = 1;
  Agent agent = 2;
}

//Client streaming
message ImportTicketRequest {
  int32 line_number = 1;           // where it came from in the legacy export
  string title = 2;
  string description = 3;
  string customer_email = 4;       // the old system knew customers by email, not id
  TicketPriority priority = 5;     // UNSPECIFIED -> treated as MEDIUM
}

message ImportTicketsResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated int32 created_ticket_ids = 3;
  repeated ImportError errors = 4;
  google.protobuf.Duration elapsed = 5;
}

message ImportError {
  int32 line_number = 1;
  string reason = 2;
}

//BiDirectional streaming
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_AGENT = 1;
  CHAT_ROLE_CUSTOMER = 2;
  CHAT_ROLE_SYSTEM = 3;            // messages the server itself sends
}

message ChatMessage {
  string text = 1;                 // the only field a CLIENT needs to fill in
  // The fields below are stamped by the SERVER from the caller's metadata. Never trust a client to tell you who it is inside the payload.
  int32 ticket_id = 2;
  string sender = 3;
  ChatRole role = 4;
  google.protobuf.Timestamp sent_at = 5;
}


